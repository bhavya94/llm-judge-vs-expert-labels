[overlap]
# Pass when at least this share of the summary's words appears in the article. On dev, CNN/DM summaries copy so
# much that 0.9 passes nearly all of them; 1.0 is the strictest cut. XSum summaries rewrite more, so the cut matters.
thresholds = [0.9, 1.0]

[agreement]
# Percentile bootstrap over the labeled answers for every interval.
bootstrap_resamples = 2000
confidence = 0.95
seed = 0

[llm]
# Prompted judges. One run judges every dev summary with one model; replies are cached in .cache/llm, so a rerun is
# free. The cap is per run and refuses any call whose worst case would pass it. The project's total cap is $25.
cap = 5.0
max_tokens = 300
# A reply with no readable verdict is asked again once with this limit. On dev, Sonnet cut 11 of 315 replies off at 300.
retry_max_tokens = 1000

# Prices in dollars per million tokens. Check them against the current price list before a paid run.
[llm.models.haiku]
id = "claude-haiku-4-5-20251001"
input_price = 1.0
output_price = 5.0

[llm.models.sonnet]
id = "claude-sonnet-5-5"
input_price = 3.0
output_price = 15.0

[qags]
# QAGS with an LLM writing and answering the questions. Three calls per summary.
model = "haiku"
max_questions = 10
max_tokens = 600
# Pass when the mean answer F1 reaches the threshold. Placeholders until the dev scores are in.
thresholds = [0.5, 0.7]
