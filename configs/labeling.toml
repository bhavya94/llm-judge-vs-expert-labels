# One person labels the 300 sampled answers Pass or Fail, with a note on what went wrong in every Fail.
# A blind second pass over some of them, at least a day later, gives that person's self-agreement: the ceiling for
# every judge. Label files are relative to this file and tracked in git: they are the ground truth.
first = "../labels/first.jsonl"
relabel = "../labels/relabel.jsonl"
relabel_size = 60
# Differs from the sample's seed, so the relabel order is not the first pass's order.
relabel_seed = 1
# Reviews of the dev summaries where a judge differs from the human majority label, one file per judge. The review
# page has its own port, so it can run beside the labeling page.
review = "../labels/review-{judge}.jsonl"
review_port = 8766
port = 8765
